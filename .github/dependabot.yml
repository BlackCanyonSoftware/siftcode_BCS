version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only (ADR 0003); revisit when that changes.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Track the oldest supported Node (engines: >=24), so the types never offer newer APIs.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
