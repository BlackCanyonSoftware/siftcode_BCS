<!-- SiftCode: the top of a page.
     Generated by brandkit. Take it and cut it down - that is what it is for.
     It needs layout.css, theme.css, and the icon sprite from ui/icons.svg
     pasted in or fetched once.

     Every path here is relative to this folder, so the file works where it
     sits. Copying it into a site means changing the prefix to wherever the
     brand folder ended up - one edit, at the top, rather than a broken image
     in the corner of every page. -->
<header class="bk-header">
  <!-- Only below 820px, where the sidebar is a drawer and this is the way in.
       Delete it along with sidebar.html if the application has no sidebar. -->
  <button class="icon-btn plain bk-menu-toggle" id="menu-toggle" type="button"
          aria-label="Open navigation" aria-controls="sidebar"
          aria-expanded="false">
    <svg class="icon lg"><use href="#i-menu"></use></svg>
  </button>

  <a class="bk-brand" href="/">
    <!-- The symbol, then the name: a lockup, and the shape the top left of an
         application wants. The cube is this brand's own colour - a product
         carrying its parent's mark gets it painted in its own - so the two
         sit together as one thing rather than the name being this brand and
         the symbol being somebody else's. -->
    <img src="../mark/mark.svg" alt="" width="34" height="34" class="bk-mark">
    <img src="../wordmark/wordmark-light.svg" alt="SiftCode" width="180"
         height="34" class="bk-only-light">
    <img src="../wordmark/wordmark-dark.svg" alt="SiftCode" width="180"
         height="34" class="bk-only-dark">
  </a>

  <!-- Placeholder, like everything else with words in it here: the shape is
       what is being shared, not the labels. The current page carries
       aria-current, which is what the stylesheet selects on - so what a screen
       reader is told and what you can see are one fact rather than two. -->
  <nav class="bk-nav" aria-label="Main">
    <a href="/" aria-current="page">Home</a>
    <a href="/pricing">Pricing</a>
    <a href="/docs">Docs</a>
  </nav>

  <!-- Pushed to the far side by its own margin, so the nav keeps its place
       whether or not this is here. "/" focuses it. -->
  <div class="bk-search input-wrap">
    <svg class="icon"><use href="#i-search"></use></svg>
    <input class="input" type="search" id="search" aria-label="Search"
           placeholder="Search…  ( / )">
  </div>

  <div class="bk-actions">
    <button class="icon-btn" type="button" aria-label="Notifications">
      <svg class="icon lg"><use href="#i-bell"></use></svg>
    </button>

    <button class="icon-btn" id="bk-theme" type="button"
            aria-pressed="false" aria-label="Switch to a dark background">
      <svg class="icon lg" aria-hidden="true" focusable="false">
        <use class="bk-only-light" href="#i-moon"></use>
        <use class="bk-only-dark" href="#i-sun"></use>
      </svg>
    </button>

    <button class="icon-btn" type="button" aria-label="Help">
      <svg class="icon lg"><use href="#i-help"></use></svg>
    </button>

    <!-- The account menu. Its initials are a placeholder and so is everything
         in the menu; what is not a placeholder is the pairing of
         aria-haspopup and aria-expanded with the hidden attribute on the menu,
         which is the whole of what makes it a menu rather than a div. -->
    <div class="bk-account">
      <button class="avatar" id="user-btn" type="button" aria-haspopup="menu"
              aria-expanded="false" aria-label="Account menu">AB</button>
      <div class="menu" id="user-menu" role="menu" hidden>
        <div class="head"><b>Your name</b>
          <div class="small muted">you@example.com</div></div>
        <hr>
        <a href="/settings" role="menuitem">
          <svg class="icon"><use href="#i-settings"></use></svg>Settings</a>
        <a href="/help" role="menuitem">
          <svg class="icon"><use href="#i-help"></use></svg>Support</a>
        <hr>
        <button type="button" role="menuitem">
          <svg class="icon"><use href="#i-logout"></use></svg>Sign out</button>
      </div>
    </div>
  </div>
</header>
