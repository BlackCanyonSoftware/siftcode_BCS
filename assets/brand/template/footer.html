<!-- SiftCode: the bottom of a page.
     Paths are relative to this folder, as in header.html.
     The legal line at the near side, this brand's symbol at the far one.
     A maker's mark - "by SomeCompany" - is deliberately not here: under a logo
     it belongs, and in the foot of an application it sits beside that
     application's own symbol and reads as a claim about the page. -->
<footer class="bk-footer">
  <p class="bk-small">
    <span>© 2026 <a href="https://blackcanyonsoftware.com">Black Canyon Software</a></span>
  </p>

  <!-- Pushed to the far side by its own margin rather than the symbol's, so
       the links land between the two corners with room on both sides.
       Placeholders; delete the nav if there is nothing to put in it and the
       row still comes out right. -->
  <nav aria-label="Footer">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/status">Status</a>
    <a href="/contact">Contact</a>
  </nav>
  <img src="../mark/mark.svg" alt="" width="28" height="28" class="bk-footmark">
</footer>
