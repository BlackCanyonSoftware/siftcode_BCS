<!-- SiftCode - paste into <head>.
     Generated by brandkit.
     Every path in these is root-relative. The files they name are in this
     folder, in icon/ and in social/ - copy those to the root of your site,
     beside index.html, and set start_url and scope if the app does not live
     at /. -->

<meta name="color-scheme" content="light dark">

<!-- One icon, and the SVG where there is one. It is the only favicon that
     stays sharp at any size, and it is the artwork itself rather than the
     artwork inset in a square. A browser offered several picks one by rules of
     its own - Chrome takes the .ico - so a list is not a preference, it is a
     lottery. favicon.ico is still in this folder for anything that asks for it
     by name; it is simply not offered here as well. -->
<link rel="icon" href="/icon.svg?v=1.56.1" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180"
      href="/icon-transparent-180.png?v=1.56.1">
<link rel="manifest" href="/site.webmanifest">

<!-- The browser's own chrome. Light gets the brand, which is the point of
     having one; dark gets the page, because a saturated bar above a dark page
     reads as a bar rather than as the top of the page. -->
<meta name="theme-color" content="#857f22"
      media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312"
      media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:site_name" content="SiftCode">
<meta property="og:title" content="SiftCode">
<meta property="og:image" content="/og-light.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="SiftCode">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image:alt" content="SiftCode">
